<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
:root{
  --bg:#0a0d10;--panel:#11161b;--rule:#232a31;
  --ink:#e8eaed;--ink-2:#9aa4ae;--ink-faint:#5b6570;
  --accent:#2dd4bf;--met:#0ca30c;--partial:#fab219;--gap:#d03b3b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background:
    radial-gradient(ellipse 700px 500px at 8% -15%, rgba(45,212,191,.14), transparent 60%),
    radial-gradient(ellipse 600px 500px at 108% 25%, rgba(45,212,191,.08), transparent 55%),
    radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px) 0 0/26px 26px,
    var(--bg);
  font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
  position:relative;
}
.frame{position:absolute;inset:40px;border:1px solid var(--rule);border-radius:14px}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 96px}
.mark{
  width:84px;height:84px;border-radius:16px;background:var(--panel);border:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center;margin-bottom:36px;
  font-family:'Consolas','Courier New',monospace;font-weight:700;font-size:15px;color:var(--accent);
  letter-spacing:0.02em;text-align:center;line-height:1.3;
}
.eyebrow{font-family:'Consolas','Courier New',monospace;font-size:19px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;font-weight:700;margin-bottom:24px}
h1{font-size:72px;font-weight:700;color:var(--ink);letter-spacing:-1.5px;margin-bottom:26px}
.rule{width:90px;height:4px;background:var(--accent);border-radius:2px;margin-bottom:30px}
p{font-size:26px;color:var(--ink-2);max-width:880px;line-height:1.55;margin-bottom:34px}
.stats{display:flex;gap:28px;font-family:'Consolas','Courier New',monospace;font-size:19px;color:var(--ink-2)}
.stats span{display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.stats strong{color:var(--ink);font-weight:700}
</style></head>
<body>
<div class="frame"></div>
<div class="wrap">
  <div class="mark">EU AI<br>ACT</div>
  <div class="eyebrow">EU AI Act &middot; NIST AI RMF</div>
  <h1>AI Compliance Crosswalk</h1>
  <div class="rule"></div>
  <p>Real AI agents checked against every high-risk-system requirement &mdash; every verdict written in-session against real evidence, not scored by a script.</p>
  <div class="stats">
    <span><span class="dot" style="background:var(--met)"></span><strong>16</strong>&nbsp;Met</span>
    <span><span class="dot" style="background:var(--partial)"></span><strong>14</strong>&nbsp;Partial</span>
    <span><span class="dot" style="background:var(--gap)"></span><strong>3</strong>&nbsp;Gap</span>
    <span style="color:var(--ink-faint)">&middot; 3 subjects &middot; 33 controls</span>
  </div>
</div>
</body></html>
